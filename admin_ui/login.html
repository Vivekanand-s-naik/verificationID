<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ANPR License Console</title>
  <style>
    :root {
      --obsidian: #0d1117;
      --obsidian-elevated: #141923;
      --obsidian-border: #232b38;
      --canvas: #f3f4f6;
      --surface: #ffffff;
      --text: #0f172a;
      --text-soft: #475569;
      --border: #dce1e8;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #991b1b;
      --info-bg: #f8fafc;
      --info-border: #cbd5e1;
      --info-text: #334155;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      background:
        radial-gradient(circle at 20% 0%, rgba(217, 119, 6, 0.14) 0%, transparent 42%),
        radial-gradient(circle at 85% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 45%),
        var(--obsidian);
      color: var(--text);
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .auth-shell {
      width: 100%;
      max-width: 420px;
    }

    .brand-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(217, 119, 6, 0.55);
      box-shadow: 0 0 0 1px rgba(217, 119, 6, 0.15), 0 8px 20px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f59e0b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 800;
      font-size: 0.84rem;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f59e0b;
    }

    .brand-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.01em;
    }

    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 3px solid var(--amber);
      border-radius: var(--radius);
      padding: 26px 24px 24px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.42);
    }

    .header {
      margin-bottom: 20px;
    }

    .title {
      margin: 0 0 4px;
      font-size: 1.32rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .subtitle {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-soft);
    }

    .banner {
      display: none;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .banner.visible { display: block; }

    .banner.error {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    .banner.info {
      background: var(--info-bg);
      border-color: var(--info-border);
      color: var(--info-text);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      min-height: 46px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      color: var(--text);
      background: #fbfcfd;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    input:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.18);
    }

    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrap input {
      padding-right: 74px;
    }

    .toggle-pw {
      position: absolute;
      right: 6px;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--text-soft);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-pw:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .submit-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      border: 1px solid #0f172a;
      border-radius: 8px;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.1s ease;
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .auth-footer {
      margin-top: 16px;
      text-align: center;
      font-size: 0.76rem;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="brand-bar">
      <div class="brand-mark" aria-hidden="true">ID</div>
      <div class="brand-copy">
        <div class="brand-eyebrow">Verification &amp; Licensing</div>
        <div class="brand-name">ANPR License Control Console</div>
      </div>
    </div>

    <main class="card">
      <div class="header">
        <h1 class="title">Operator Sign In</h1>
        <p class="subtitle">Authenticate with your SystemOwner or Admin credentials.</p>
      </div>

      <div id="status-banner" class="banner info" role="status"></div>
      <div id="error-banner" class="banner error" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" id="toggle-pw" class="toggle-pw" aria-label="Show password">Show</button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">Sign In</button>
      </form>
    </main>

    <div class="auth-footer">BCRYPT AUTHENTICATED &bull; SESSION REVOCABLE</div>
  </div>

  <script>
    (function () {
      const TOKEN_KEY = "anpr_admin_token";
      const EXPIRES_KEY = "anpr_admin_expires_at";

      const params = new URLSearchParams(window.location.search);
      const statusBanner = document.getElementById("status-banner");
      const errorBanner = document.getElementById("error-banner");
      const form = document.getElementById("login-form");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const togglePwBtn = document.getElementById("toggle-pw");
      const submitBtn = document.getElementById("submit-btn");

      if (params.get("expired") === "1") {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(EXPIRES_KEY);
        statusBanner.textContent = "Your session has expired. Please sign in again.";
        statusBanner.classList.add("visible");
      } else if (params.get("logged_out") === "1") {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(EXPIRES_KEY);
        statusBanner.textContent = "You have been signed out cleanly.";
        statusBanner.classList.add("visible");
      }

      togglePwBtn.addEventListener("click", function () {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        togglePwBtn.textContent = show ? "Hide" : "Show";
        togglePwBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });

      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.classList.add("visible");
      }

      function clearError() {
        errorBanner.textContent = "";
        errorBanner.classList.remove("visible");
      }

      form.addEventListener("submit", async function (evt) {
        evt.preventDefault();
        clearError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) {
          showError("Please enter both username and password.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Verifying...";

        try {
          const resp = await fetch("/api/v1/admin/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password }),
          });
          const data = await resp.json().catch(function () { return {}; });
          if (!resp.ok) {
            showError(data.detail || "Sign in failed. Please check your credentials.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign In";
            return;
          }

          if (data.token) {
            sessionStorage.setItem(TOKEN_KEY, data.token);
          }
          if (data.expires_at) {
            sessionStorage.setItem(EXPIRES_KEY, data.expires_at);
          }
          window.location.replace("/admin");
        } catch (_err) {
          showError("Network error while signing in. Please try again.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign In";
        }
      });
    })();
  </script>
</body>
</html>
