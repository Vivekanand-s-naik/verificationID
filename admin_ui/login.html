<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ANPR License Admin</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-subtle: #f9fafb;
      --text: #111827;
      --text-soft: #4b5563;
      --text-muted: #6b7280;
      --border: #e2e5ea;
      --border-strong: #d1d5db;
      --primary: #111827;
      --primary-hover: #1f2937;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #991b1b;
      --info-bg: #f9fafb;
      --info-border: #d1d5db;
      --info-text: #374151;
      --radius: 6px;
      --radius-sm: 4px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .auth-shell {
      width: 100%;
      max-width: 390px;
    }

    .brand-bar {
      margin-bottom: 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .brand-scope {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 20px 20px;
    }

    .header {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .title {
      margin: 0 0 2px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }

    .subtitle {
      margin: 0;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .banner {
      display: none;
      margin-bottom: 14px;
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .banner.visible { display: block; }

    .banner.error {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    .banner.info {
      background: var(--info-bg);
      border-color: var(--info-border);
      color: var(--info-text);
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-soft);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.12s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--text);
    }

    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrap input {
      padding-right: 68px;
    }

    .toggle-pw {
      position: absolute;
      right: 5px;
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-subtle);
      color: var(--text-soft);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
    }

    .toggle-pw:hover {
      background: #f3f4f6;
      color: var(--text);
    }

    .submit-btn {
      width: 100%;
      min-height: 40px;
      margin-top: 2px;
      border: 1px solid var(--primary);
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      input[type="text"],
      input[type="password"] {
        font-size: 16px;
        min-height: 44px;
      }

      .submit-btn {
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="brand-bar">
      <div class="brand-name">ANPR License Admin</div>
      <div class="brand-scope">Operations Console</div>
    </div>

    <main class="card">
      <div class="header">
        <h1 class="title">Sign In</h1>
        <p class="subtitle">Authenticate with your owner or admin credentials.</p>
      </div>

      <div id="status-banner" class="banner info" role="status"></div>
      <div id="error-banner" class="banner error" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" id="toggle-pw" class="toggle-pw" aria-label="Show password">Show</button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">Sign In</button>
      </form>
    </main>
  </div>

  <script>
    (function () {
      const TOKEN_KEY = "anpr_admin_token";
      const EXPIRES_KEY = "anpr_admin_expires_at";

      const params = new URLSearchParams(window.location.search);
      const statusBanner = document.getElementById("status-banner");
      const errorBanner = document.getElementById("error-banner");
      const form = document.getElementById("login-form");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const togglePwBtn = document.getElementById("toggle-pw");
      const submitBtn = document.getElementById("submit-btn");

      if (params.get("expired") === "1") {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(EXPIRES_KEY);
        statusBanner.textContent = "Your session has expired. Please sign in again.";
        statusBanner.classList.add("visible");
      } else if (params.get("logged_out") === "1") {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(EXPIRES_KEY);
        statusBanner.textContent = "You have been signed out.";
        statusBanner.classList.add("visible");
      }

      togglePwBtn.addEventListener("click", function () {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        togglePwBtn.textContent = show ? "Hide" : "Show";
        togglePwBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });

      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.classList.add("visible");
      }

      function clearError() {
        errorBanner.textContent = "";
        errorBanner.classList.remove("visible");
      }

      form.addEventListener("submit", async function (evt) {
        evt.preventDefault();
        clearError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) {
          showError("Please enter both username and password.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Verifying...";

        try {
          const resp = await fetch("/api/v1/admin/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password }),
          });
          const data = await resp.json().catch(function () { return {}; });
          if (!resp.ok) {
            showError(data.detail || "Sign in failed. Please check your credentials.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign In";
            return;
          }

          if (data.token) {
            sessionStorage.setItem(TOKEN_KEY, data.token);
          }
          if (data.expires_at) {
            sessionStorage.setItem(EXPIRES_KEY, data.expires_at);
          }
          window.location.replace("/admin");
        } catch (_err) {
          showError("Network error while signing in. Please try again.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign In";
        }
      });
    })();
  </script>
</body>
</html>
