<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — ANPR License Admin</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --surface: #ffffff;
      --surface-alt: #f9fafb;
      --text: #111827;
      --muted: #4b5563;
      --border: #d1d5db;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --success: #15803d;
      --success-bg: #dcfce7;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --neutral-bg: #e5e7eb;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      min-width: 0;
      max-width: 100%;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .session-meta {
      font-size: 0.82rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button, select, input {
      font-family: inherit;
    }
    .btn {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) {
      background: var(--surface-alt);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .btn-success {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .btn-success:hover:not(:disabled) {
      background: #166534;
    }
    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) {
      background: #991b1b;
    }
    .btn-sm {
      min-height: 38px;
      padding: 6px 10px;
      font-size: 0.85rem;
    }
    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 16px;
    }
    .tab-btn {
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .count-pill {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(17, 24, 39, 0.1);
      color: inherit;
    }
    .tab-btn.active .count-pill {
      background: rgba(255, 255, 255, 0.22);
    }
    .panel {
      display: none;
    }
    .panel.active {
      display: block;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title {
      margin: 0 0 12px;
      font-size: 1.02rem;
      font-weight: 700;
    }
    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      left: 16px;
      max-width: 440px;
      margin-left: auto;
      z-index: 50;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #111827;
      color: #ffffff;
      font-size: 0.92rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      display: none;
    }
    .toast.visible { display: block; }
    .toast.error {
      background: #991b1b;
      border-color: #7f1d1d;
    }
    .toast.success {
      background: #166534;
      border-color: #14532d;
    }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .badge-active, .badge-approved {
      background: var(--success-bg);
      color: var(--success);
    }
    .badge-revoked, .badge-rejected {
      background: var(--danger-bg);
      color: var(--danger);
    }
    .badge-expired {
      background: var(--warn-bg);
      color: var(--warn);
    }
    .badge-pending {
      background: #dbeafe;
      color: #1e40af;
    }
    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }
    .grid-cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 820px) {
      .grid-cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .sub-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sub-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .sub-id {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-all;
    }
    .kv-list {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      font-size: 0.9rem;
    }
    .kv-label {
      color: var(--muted);
      font-weight: 600;
    }
    .thumb-wrap {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f9fafb;
      padding: 6px;
      text-align: center;
    }
    .thumb-img {
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 6px;
      cursor: zoom-in;
      display: block;
      margin: 0 auto;
    }
    .thumb-hint {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .sub-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 720px) {
      .form-grid {
        grid-template-columns: 1.3fr 1.5fr auto;
        align-items: end;
      }
    }
    .field label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--muted);
    }
    .field input,
    .search-input,
    .plan-select {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
      color: var(--text);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .search-input {
      max-width: 340px;
    }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pill-btn {
      min-height: 38px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pill-btn.active {
      background: #111827;
      border-color: #111827;
      color: #ffffff;
    }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table.lic-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    table.lic-table th,
    table.lic-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: top;
    }
    table.lic-table th {
      background: var(--surface-alt);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    table.lic-table tr:last-child td {
      border-bottom: none;
    }
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .renew-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .plan-select {
      width: auto;
      min-width: 165px;
      min-height: 38px;
      font-size: 0.88rem;
      padding: 4px 8px;
    }
    @media (max-width: 859px) {
      .table-wrap {
        background: transparent;
        border: none;
      }
      table.lic-table thead {
        display: none;
      }
      table.lic-table,
      table.lic-table tbody,
      table.lic-table tr,
      table.lic-table td {
        display: block;
        width: 100%;
      }
      table.lic-table tr {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
        margin-bottom: 12px;
      }
      table.lic-table td {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px solid #f3f4f6;
      }
      table.lic-table td::before {
        content: attr(data-label);
        font-weight: 600;
        color: var(--muted);
        flex-shrink: 0;
      }
      table.lic-table td:last-child {
        display: block;
        border-bottom: none;
        padding-top: 10px;
      }
      table.lic-table td:last-child::before {
        display: block;
        margin-bottom: 8px;
      }
      .plan-select {
        flex: 1 1 160px;
        min-height: 42px;
      }
      .btn-sm {
        min-height: 42px;
      }
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(17, 24, 39, 0.84);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-content {
      max-width: 96vw;
      max-height: 92vh;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .modal-img {
      max-width: 90vw;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 6px;
      background: #111827;
    }
    /* =====================================================================
       HOME TAB — STATE A: ALL SYSTEMS ACTIVE (RICH, ANIMATED SAAS SHOWCASE)
       ===================================================================== */
    @keyframes homePulseRing {
      0% { transform: scale(1); opacity: 0.72; }
      72% { transform: scale(2.45); opacity: 0; }
      100% { transform: scale(2.45); opacity: 0; }
    }
    @keyframes homeGlowBreath {
      0%, 100% {
        box-shadow: 0 18px 42px rgba(6, 78, 59, 0.28), 0 0 0 1px rgba(52, 211, 153, 0.36), inset 0 1px 0 rgba(167, 243, 208, 0.22);
      }
      50% {
        box-shadow: 0 22px 54px rgba(16, 185, 129, 0.38), 0 0 0 1px rgba(110, 231, 183, 0.54), inset 0 1px 0 rgba(209, 250, 229, 0.34);
      }
    }
    @keyframes homeFadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes homeAmbientShift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate3d(18px, -10px, 0) scale(1.06); opacity: 0.75; }
    }

    .home-good-shell {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      padding: 28px;
      color: #ecfdf5;
      background:
        radial-gradient(circle at 12% 8%, rgba(16, 185, 129, 0.36) 0%, rgba(6, 78, 59, 0.14) 38%, transparent 65%),
        linear-gradient(135deg, #064e3b 0%, #092b2d 48%, #0f172a 100%);
      animation: homeGlowBreath 4.2s ease-in-out infinite, homeFadeUp 0.38s ease-out;
    }
    .home-good-shell::before {
      content: "";
      position: absolute;
      top: -90px;
      right: -70px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.32) 0%, rgba(16, 185, 129, 0) 70%);
      pointer-events: none;
      animation: homeAmbientShift 7s ease-in-out infinite;
    }
    .home-good-shell > * {
      position: relative;
      z-index: 1;
    }
    .good-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }
    .good-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(110, 231, 183, 0.52);
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.25);
      color: #a7f3d0;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .good-beacon {
      position: relative;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 12px #34d399, 0 0 22px rgba(52, 211, 153, 0.75);
      flex-shrink: 0;
    }
    .good-beacon::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #6ee7b7;
      animation: homePulseRing 2.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .good-updated {
      font-size: 0.8rem;
      color: rgba(167, 243, 208, 0.78);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .good-hero-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .good-hero-copy {
      flex: 1 1 260px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .good-eyebrow {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6ee7b7;
      margin-bottom: 6px;
    }
    .good-plan-title {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 4vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #ffffff;
      line-height: 1.15;
    }
    .good-submeta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 0.88rem;
      color: #d1fae5;
      overflow-wrap: anywhere;
    }
    .good-submeta .mono {
      color: #a7f3d0;
      font-weight: 600;
    }
    .good-days-card {
      flex: 0 0 auto;
      min-width: 205px;
      padding: 18px 24px;
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(16, 185, 129, 0.22), rgba(2, 44, 34, 0.68));
      border: 1px solid rgba(110, 231, 183, 0.42);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: right;
      transition: transform 0.22s ease, border-color 0.22s ease;
    }
    .good-days-card:hover {
      transform: translateY(-2px);
      border-color: rgba(167, 243, 208, 0.72);
    }
    .good-days-num {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1;
      color: #6ee7b7;
      text-shadow: 0 0 22px rgba(52, 211, 153, 0.45);
    }
    .good-days-label {
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #d1fae5;
    }
    .good-days-date {
      margin-top: 4px;
      font-size: 0.8rem;
      color: rgba(167, 243, 208, 0.84);
    }
    .good-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      animation: homeFadeUp 0.5s ease-out;
    }
    .good-metric-card {
      padding: 16px 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.52);
      border: 1px solid rgba(110, 231, 183, 0.24);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .good-metric-card:hover {
      transform: translateY(-2px);
      border-color: rgba(110, 231, 183, 0.52);
      background: rgba(15, 23, 42, 0.68);
    }
    .good-metric-k {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .good-metric-v {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.7rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
    }
    .good-metric-sub {
      margin-top: 4px;
      font-size: 0.8rem;
      color: #6ee7b7;
    }
    .good-fleet-card {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.44);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .good-fleet-title {
      margin: 0 0 10px;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }
    .good-fleet-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px 12px;
      padding: 8px 0;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
      font-size: 0.88rem;
      color: #e2e8f0;
    }
    .good-fleet-row:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .good-fleet-days {
      color: #6ee7b7;
      font-weight: 600;
    }
    @media (prefers-reduced-motion: reduce) {
      .home-good-shell,
      .home-good-shell::before,
      .good-beacon::after,
      .good-metrics,
      .good-days-card,
      .good-metric-card {
        animation: none !important;
        transition: none !important;
      }
    }

    /* =====================================================================
       HOME TAB — STATE B: NEEDS ATTENTION (PLAIN, FLAT, ZERO ANIMATION)
       ===================================================================== */
    .home-plain-shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .plain-banner {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 14px 16px;
    }
    .plain-banner h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #111827;
    }
    .plain-banner p {
      margin: 0;
      font-size: 0.9rem;
      color: #4b5563;
    }
    .plain-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .plain-metric {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 12px 14px;
    }
    .plain-metric-k {
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b7280;
    }
    .plain-metric-v {
      margin-top: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.35rem;
      font-weight: 700;
      color: #111827;
    }
    .plain-metric-sub {
      margin-top: 2px;
      font-size: 0.78rem;
      color: #6b7280;
    }
    .plain-section {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
    }
    .plain-section-head {
      padding: 10px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #374151;
    }
    .plain-issue-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
      padding: 12px 14px;
      border-bottom: 1px solid #e5e7eb;
    }
    .plain-issue-row:last-child {
      border-bottom: none;
    }
    .plain-issue-main {
      flex: 1 1 200px;
      min-width: 0;
    }
    .plain-issue-title {
      font-size: 0.94rem;
      font-weight: 600;
      color: #111827;
    }
    .plain-issue-tag {
      display: inline-block;
      margin-right: 8px;
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid #9ca3af;
      background: #f3f4f6;
      color: #1f2937;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      font-weight: 700;
      vertical-align: middle;
    }
    .plain-issue-detail {
      margin-top: 3px;
      font-size: 0.85rem;
      color: #4b5563;
    }
    .plain-jump-btn {
      min-height: 38px;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #6b7280;
      background: #ffffff;
      color: #111827;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .plain-jump-btn:hover {
      background: #f3f4f6;
    }
    .plain-active-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px 12px;
      padding: 9px 14px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 0.86rem;
      color: #374151;
    }
    .plain-active-row:last-child {
      border-bottom: none;
    }
    @media (max-width: 680px) {
      .home-good-shell {
        padding: 20px 16px;
        border-radius: 14px;
      }
      .good-days-card {
        width: 100%;
        min-width: 0;
        text-align: left;
      }
      .good-metrics,
      .plain-metrics {
        grid-template-columns: 1fr;
      }
      .plain-jump-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>ANPR License Admin</h1>
        <div id="session-meta" class="session-meta">Loading session...</div>
      </div>
      <div class="topbar-actions">
        <button type="button" id="refresh-btn" class="btn">Refresh</button>
        <button type="button" id="logout-btn" class="btn">Logout</button>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="tabs" role="tablist" aria-label="Admin sections">
      <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="home">
        Home <span id="home-pill" class="count-pill">…</span>
      </button>
      <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="pending">
        Pending Payments <span id="pending-count" class="count-pill">0</span>
      </button>
      <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="licenses">
        Licenses <span id="licenses-count" class="count-pill">0</span>
      </button>
      <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="history">
        History <span id="history-count" class="count-pill">0</span>
      </button>
    </nav>

    <section id="panel-home" class="panel active" role="tabpanel">
      <div id="home-summary"><div class="empty-state">Loading overview...</div></div>
    </section>

    <section id="panel-pending" class="panel" role="tabpanel">
      <div id="pending-list"></div>
    </section>

    <section id="panel-licenses" class="panel" role="tabpanel">
      <div class="card">
        <h2 class="card-title">Create New License</h2>
        <form id="create-license-form" class="form-grid">
          <div class="field">
            <label for="new-license-key">License Key</label>
            <input id="new-license-key" type="text" placeholder="e.g. VIVEK-ANPR-0002" required />
          </div>
          <div class="field">
            <label for="new-license-note">Note (optional)</label>
            <input id="new-license-note" type="text" placeholder="Customer or gate location" />
          </div>
          <button type="submit" id="create-license-btn" class="btn btn-primary">Create License</button>
        </form>
      </div>

      <div class="toolbar">
        <input id="license-search" class="search-input" type="search" placeholder="Filter by key, device ID, or note..." aria-label="Filter licenses" />
      </div>
      <div id="licenses-container"></div>
    </section>

    <section id="panel-history" class="panel" role="tabpanel">
      <div class="filter-pills">
        <button type="button" class="pill-btn active" data-history-filter="all">All Reviewed</button>
        <button type="button" class="pill-btn" data-history-filter="approved">Approved</button>
        <button type="button" class="pill-btn" data-history-filter="rejected">Rejected</button>
      </div>
      <div id="history-list"></div>
    </section>
  </main>

  <div id="lightbox" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Payment screenshot preview">
    <div class="modal-content">
      <div class="modal-head">
        <strong id="lightbox-title">Payment Screenshot</strong>
        <div style="display:flex; gap:8px;">
          <a id="lightbox-raw-link" class="btn btn-sm" target="_blank" rel="noopener noreferrer">Open Full Image</a>
          <button type="button" id="lightbox-close" class="btn btn-sm">Close</button>
        </div>
      </div>
      <img id="lightbox-img" class="modal-img" alt="Payment screenshot" />
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const TOKEN_KEY = "anpr_admin_token";
      const EXPIRES_KEY = "anpr_admin_expires_at";

      const state = {
        activeTab: "home",
        historyFilter: "all",
        plans: {},
        pending: [],
        licenses: [],
        history: [],
        summary: null,
        licenseSearch: "",
      };

      const toastEl = document.getElementById("toast");
      let toastTimer = null;

      function showToast(message, kind) {
        toastEl.textContent = message;
        toastEl.className = "toast visible " + (kind || "");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove("visible");
        }, 4000);
      }

      function escapeHtml(val) {
        if (val === null || val === undefined) return "";
        return String(val)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function safeDataUri(uri) {
        if (typeof uri !== "string") return "";
        const match = /^data:image\/(png|jpeg|jpg|webp);base64,[A-Za-z0-9+/=]+$/.test(uri);
        return match ? uri : "";
      }

      function redirectToLogin(expired) {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(EXPIRES_KEY);
        window.location.replace(expired ? "/admin/login?expired=1" : "/admin/login?logged_out=1");
      }

      async function apiFetch(url, options) {
        const opts = Object.assign({ credentials: "same-origin" }, options || {});
        const headers = new Headers(opts.headers || {});
        const storedToken = sessionStorage.getItem(TOKEN_KEY);
        if (storedToken && !headers.has("Authorization")) {
          headers.set("Authorization", "Bearer " + storedToken);
        }
        opts.headers = headers;

        const resp = await fetch(url, opts);
        if (resp.status === 401) {
          redirectToLogin(true);
          throw new Error("Session expired");
        }
        const contentType = resp.headers.get("content-type") || "";
        const data = contentType.includes("application/json")
          ? await resp.json().catch(function () { return {}; })
          : {};
        if (!resp.ok) {
          throw new Error(data.detail || ("Request failed (" + resp.status + ")"));
        }
        return data;
      }

      function formatRelative(iso) {
        if (!iso) return "";
        const dt = new Date(iso);
        if (Number.isNaN(dt.getTime())) return "";
        const diffMs = dt.getTime() - Date.now();
        const absSec = Math.round(Math.abs(diffMs) / 1000);
        const past = diffMs < 0;
        if (absSec < 60) return past ? "just now" : "in <1m";
        const mins = Math.round(absSec / 60);
        if (mins < 60) return past ? mins + "m ago" : "in " + mins + "m";
        const hrs = Math.round(mins / 60);
        if (hrs < 48) return past ? hrs + "h ago" : "in " + hrs + "h";
        const days = Math.round(hrs / 24);
        return past ? days + "d ago" : "in " + days + "d";
      }

      function formatDate(iso) {
        if (!iso) return "—";
        const dt = new Date(iso);
        if (Number.isNaN(dt.getTime())) return escapeHtml(iso);
        const formatted = dt.toLocaleString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
        const rel = formatRelative(iso);
        return rel ? formatted + " (" + rel + ")" : formatted;
      }

      function effectiveLicenseStatus(lic) {
        const raw = (lic.status || "").toLowerCase();
        if (raw === "revoked") return "revoked";
        if (raw === "expired") return "expired";
        if (lic.expires_at) {
          const exp = new Date(lic.expires_at);
          if (!Number.isNaN(exp.getTime()) && exp.getTime() <= Date.now()) {
            return "expired";
          }
        }
        return raw || "active";
      }

      function setActiveTab(tabName) {
        state.activeTab = tabName;
        document.querySelectorAll(".tab-btn").forEach(function (btn) {
          const active = btn.dataset.tab === tabName;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-selected", active ? "true" : "false");
        });
        document.querySelectorAll(".panel").forEach(function (panel) {
          panel.classList.toggle("active", panel.id === "panel-" + tabName);
        });
      }

      function openLightbox(sub) {
        const src = safeDataUri(sub.image_data_uri);
        if (!src) return;
        document.getElementById("lightbox-title").textContent =
          "Submission #" + sub.id + " — " + (sub.license_key || "");
        document.getElementById("lightbox-img").src = src;
        document.getElementById("lightbox-raw-link").href =
          "/api/v1/admin/payment-submissions/" + encodeURIComponent(sub.id) + "/image";
        document.getElementById("lightbox").classList.add("open");
      }

      function closeLightbox() {
        document.getElementById("lightbox").classList.remove("open");
        document.getElementById("lightbox-img").removeAttribute("src");
      }

      function renderPending() {
        document.getElementById("pending-count").textContent = String(state.pending.length);
        const root = document.getElementById("pending-list");
        if (!state.pending.length) {
          root.innerHTML = '<div class="empty-state">No pending payment submissions right now.</div>';
          return;
        }

        const html = state.pending.map(function (sub) {
          const imgUri = safeDataUri(sub.image_data_uri);
          const priceTxt = sub.price_inr !== null && sub.price_inr !== undefined ? "₹" + escapeHtml(sub.price_inr) : "—";
          const planTxt = escapeHtml(sub.plan_label || sub.claimed_plan) +
            " (" + escapeHtml(sub.claimed_plan) + ", " + priceTxt + ")";
          return (
            '<article class="sub-card" data-sub-id="' + escapeHtml(sub.id) + '">' +
              '<div class="sub-head">' +
                '<div>' +
                  '<div class="sub-id">Submission #' + escapeHtml(sub.id) + '</div>' +
                  '<strong class="mono">' + escapeHtml(sub.license_key) + '</strong>' +
                '</div>' +
                '<span class="badge badge-pending">Pending</span>' +
              '</div>' +
              '<div class="kv-list">' +
                '<span class="kv-label">Device ID</span><span class="mono">' + escapeHtml(sub.device_id || "—") + '</span>' +
                '<span class="kv-label">Plan</span><span>' + planTxt + '</span>' +
                '<span class="kv-label">Submitted</span><span>' + escapeHtml(formatDate(sub.submitted_at)) + '</span>' +
              '</div>' +
              (imgUri
                ? '<div class="thumb-wrap">' +
                    '<img class="thumb-img" src="' + imgUri + '" alt="Payment screenshot #' + escapeHtml(sub.id) + '" data-action="zoom" />' +
                    '<div class="thumb-hint">Tap screenshot to enlarge</div>' +
                  '</div>'
                : '<div class="empty-state">Screenshot unavailable</div>') +
              '<div class="sub-actions">' +
                '<button type="button" class="btn btn-success" data-action="approve">Approve</button>' +
                '<button type="button" class="btn btn-danger" data-action="reject">Reject</button>' +
              '</div>' +
            '</article>'
          );
        }).join("");

        root.innerHTML = '<div class="grid-cards">' + html + '</div>';
      }

      function renderPlanOptions(selectedPlan) {
        const keys = Object.keys(state.plans || {});
        if (!keys.length) {
          return '<option value="monthly">Monthly</option>';
        }
        return keys.map(function (k) {
          const meta = state.plans[k] || {};
          const label = (meta.label || k) + " (₹" + (meta.price_inr ?? "?") + " / " + (meta.days ?? "?") + "d)";
          const selected = k === selectedPlan ? " selected" : "";
          return '<option value="' + escapeHtml(k) + '"' + selected + '>' + escapeHtml(label) + '</option>';
        }).join("");
      }

      function renderLicenses() {
        document.getElementById("licenses-count").textContent = String(state.licenses.length);
        const root = document.getElementById("licenses-container");
        const query = state.licenseSearch.trim().toLowerCase();
        const filtered = state.licenses.filter(function (lic) {
          if (!query) return true;
          return (
            (lic.license_key || "").toLowerCase().includes(query) ||
            (lic.device_id || "").toLowerCase().includes(query) ||
            (lic.note || "").toLowerCase().includes(query)
          );
        });

        if (!filtered.length) {
          root.innerHTML = '<div class="empty-state">No licenses match your view.</div>';
          return;
        }

        const rowsHtml = filtered.map(function (lic) {
          const eff = effectiveLicenseStatus(lic);
          const badgeCls = eff === "revoked" ? "badge-revoked" : (eff === "expired" ? "badge-expired" : "badge-active");
          const defaultPlan = state.plans && state.plans[lic.plan] ? lic.plan : "monthly";
          const isRevoked = (lic.status || "").toLowerCase() === "revoked";
          return (
            '<tr data-license-key="' + escapeHtml(lic.license_key) + '">' +
              '<td data-label="License Key"><strong class="mono">' + escapeHtml(lic.license_key) + '</strong></td>' +
              '<td data-label="Status"><span class="badge ' + badgeCls + '">' + escapeHtml(eff) + '</span></td>' +
              '<td data-label="Plan">' + escapeHtml(lic.plan || "trial") + '</td>' +
              '<td data-label="Expires At">' + escapeHtml(formatDate(lic.expires_at)) + '</td>' +
              '<td data-label="Device ID"><span class="mono">' + escapeHtml(lic.device_id || "—") + '</span></td>' +
              '<td data-label="Last Seen">' + escapeHtml(formatDate(lic.last_seen)) + '</td>' +
              '<td data-label="Note">' + escapeHtml(lic.note || "—") + '</td>' +
              '<td data-label="Actions">' +
                '<div class="row-actions">' +
                  (isRevoked
                    ? '<button type="button" class="btn btn-success btn-sm" data-lic-action="reactivate">Reactivate</button>'
                    : '<button type="button" class="btn btn-danger btn-sm" data-lic-action="revoke">Revoke</button>' +
                      '<button type="button" class="btn btn-sm" data-lic-action="reactivate">Reactivate</button>') +
                  '<div class="renew-group">' +
                    '<select class="plan-select" aria-label="Renewal plan for ' + escapeHtml(lic.license_key) + '">' +
                      renderPlanOptions(defaultPlan) +
                    '</select>' +
                    '<button type="button" class="btn btn-primary btn-sm" data-lic-action="renew">Renew</button>' +
                  '</div>' +
                '</div>' +
              '</td>' +
            '</tr>'
          );
        }).join("");

        root.innerHTML =
          '<div class="table-wrap">' +
            '<table class="lic-table">' +
              '<thead><tr>' +
                '<th>License Key</th>' +
                '<th>Status</th>' +
                '<th>Plan</th>' +
                '<th>Expires At</th>' +
                '<th>Device ID</th>' +
                '<th>Last Seen</th>' +
                '<th>Note</th>' +
                '<th>Actions</th>' +
              '</tr></thead>' +
              '<tbody>' + rowsHtml + '</tbody>' +
            '</table>' +
          '</div>';
      }

      function renderHistory() {
        document.getElementById("history-count").textContent = String(state.history.length);
        const root = document.getElementById("history-list");
        const items = state.history.filter(function (sub) {
          if (state.historyFilter === "all") return true;
          return (sub.status || "").toLowerCase() === state.historyFilter;
        });

        if (!items.length) {
          root.innerHTML = '<div class="empty-state">No reviewed submissions found.</div>';
          return;
        }

        const html = items.map(function (sub) {
          const st = (sub.status || "").toLowerCase();
          const badgeCls = st === "approved" ? "badge-approved" : "badge-rejected";
          const imgUri = safeDataUri(sub.image_data_uri);
          const priceTxt = sub.price_inr !== null && sub.price_inr !== undefined ? "₹" + escapeHtml(sub.price_inr) : "—";
          return (
            '<article class="sub-card" data-history-id="' + escapeHtml(sub.id) + '">' +
              '<div class="sub-head">' +
                '<div>' +
                  '<div class="sub-id">Submission #' + escapeHtml(sub.id) + '</div>' +
                  '<strong class="mono">' + escapeHtml(sub.license_key) + '</strong>' +
                '</div>' +
                '<span class="badge ' + badgeCls + '">' + escapeHtml(st) + '</span>' +
              '</div>' +
              '<div class="kv-list">' +
                '<span class="kv-label">Device ID</span><span class="mono">' + escapeHtml(sub.device_id || "—") + '</span>' +
                '<span class="kv-label">Plan</span><span>' + escapeHtml(sub.plan_label || sub.claimed_plan) + ' (' + priceTxt + ')</span>' +
                '<span class="kv-label">Submitted</span><span>' + escapeHtml(formatDate(sub.submitted_at)) + '</span>' +
              '</div>' +
              (imgUri
                ? '<div class="thumb-wrap">' +
                    '<img class="thumb-img" src="' + imgUri + '" alt="Reviewed screenshot #' + escapeHtml(sub.id) + '" data-history-zoom="1" />' +
                  '</div>'
                : '') +
            '</article>'
          );
        }).join("");

        root.innerHTML = '<div class="grid-cards">' + html + '</div>';
      }

      function formatInr(amount) {
        const n = Number(amount || 0);
        try {
          return "₹" + n.toLocaleString("en-IN");
        } catch (_e) {
          return "₹" + String(n);
        }
      }

      function animateCounter(el, targetVal, formatter) {
        if (!el) return;
        const target = Math.max(0, Number(targetVal || 0));
        const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduced || target === 0) {
          el.textContent = formatter ? formatter(target) : String(target);
          return;
        }
        const startTime = performance.now();
        const duration = 520;
        function tick(now) {
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = Math.round(target * eased);
          el.textContent = formatter ? formatter(current) : String(current);
          if (progress < 1) {
            requestAnimationFrame(tick);
          }
        }
        requestAnimationFrame(tick);
      }

      function issueTypeTag(issueType) {
        if (issueType === "pending_payments") return "PENDING";
        if (issueType === "revoked") return "REVOKED";
        if (issueType === "expired") return "EXPIRED";
        if (issueType === "expiring_soon") return "EXPIRING";
        return "INFO";
      }

      function renderSummary() {
        const root = document.getElementById("home-summary");
        const pill = document.getElementById("home-pill");
        const s = state.summary;
        if (!s) {
          root.innerHTML = '<div class="empty-state">Loading overview...</div>';
          return;
        }
        const c = s.counts || {};
        const isGood = s.overall_state === "all_good";
        const issues = s.issues || [];
        const activeList = s.active_licenses || [];
        const p = s.primary_license || activeList[0] || null;
        const totalLic = Number(c.total_licenses || 0);
        const activeLic = Number(c.active_licenses || 0);
        const pendingPay = Number(c.pending_payments || 0);
        const approvedMonth = Number(c.approved_payments_this_month || 0);
        const revenueMonth = Number(c.revenue_this_month_inr || 0);

        if (isGood) {
          if (pill) pill.textContent = "OK";
          const daysRem = p && p.days_remaining !== null && p.days_remaining !== undefined
            ? Number(p.days_remaining)
            : null;
          const planLabel = p ? (p.plan_label || p.plan || "Active Plan") : "Active";
          const licKey = p ? p.license_key : "";
          const expDate = p && p.expires_date ? p.expires_date : "No expiry";
          const fleetExtra = activeList.length > 1
            ? (
                '<div class="good-fleet-card">' +
                  '<h3 class="good-fleet-title">Active Fleet (' + escapeHtml(activeList.length) + ')</h3>' +
                  activeList.map(function (lic) {
                    const dTxt = lic.days_remaining !== null && lic.days_remaining !== undefined
                      ? lic.days_remaining + "d remaining"
                      : "Active";
                    return (
                      '<div class="good-fleet-row">' +
                        '<span><strong class="mono">' + escapeHtml(lic.license_key) + '</strong> &middot; ' + escapeHtml(lic.plan_label || lic.plan) + '</span>' +
                        '<span class="good-fleet-days">' + escapeHtml(dTxt) + (lic.expires_date ? ' (until ' + escapeHtml(lic.expires_date) + ')' : '') + '</span>' +
                      '</div>'
                    );
                  }).join("") +
                '</div>'
              )
            : "";

          root.innerHTML =
            '<div class="home-good-shell" data-home-state="all_good">' +
              '<div class="good-top-row">' +
                '<div class="good-status-badge">' +
                  '<span class="good-beacon" aria-hidden="true"></span>' +
                  '<span>All Systems Active</span>' +
                '</div>' +
                '<div class="good-updated">Checked ' + escapeHtml(formatDate(s.generated_at)) + '</div>' +
              '</div>' +
              '<div class="good-hero-grid">' +
                '<div class="good-hero-copy">' +
                  '<div class="good-eyebrow">Active Subscription</div>' +
                  '<h2 class="good-plan-title">' + escapeHtml(planLabel) + '</h2>' +
                  '<div class="good-submeta">' +
                    '<span>Key: <span class="mono">' + escapeHtml(licKey || "—") + '</span></span>' +
                    (p && p.device_id ? '<span>Device: <span class="mono">' + escapeHtml(p.device_id) + '</span></span>' : '') +
                    (p && p.note ? '<span>' + escapeHtml(p.note) + '</span>' : '') +
                  '</div>' +
                '</div>' +
                '<div class="good-days-card">' +
                  '<div class="good-days-num" id="home-days-counter">' + (daysRem !== null ? escapeHtml(daysRem) : "∞") + '</div>' +
                  '<div class="good-days-label">' + (daysRem === 1 ? "Day Remaining" : "Days Remaining") + '</div>' +
                  '<div class="good-days-date">Valid through ' + escapeHtml(expDate) + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="good-metrics">' +
                '<div class="good-metric-card">' +
                  '<div class="good-metric-k">Total Licenses</div>' +
                  '<div class="good-metric-v" id="home-metric-total">' + escapeHtml(totalLic) + '</div>' +
                  '<div class="good-metric-sub">' + escapeHtml(activeLic) + ' active &amp; healthy</div>' +
                '</div>' +
                '<div class="good-metric-card">' +
                  '<div class="good-metric-k">Pending Payments</div>' +
                  '<div class="good-metric-v">0</div>' +
                  '<div class="good-metric-sub">Queue clear</div>' +
                '</div>' +
                '<div class="good-metric-card">' +
                  '<div class="good-metric-k">Revenue This Month</div>' +
                  '<div class="good-metric-v" id="home-metric-rev">' + escapeHtml(formatInr(revenueMonth)) + '</div>' +
                  '<div class="good-metric-sub">' + escapeHtml(approvedMonth) + ' approved ' + (approvedMonth === 1 ? "payment" : "payments") + '</div>' +
                '</div>' +
              '</div>' +
              fleetExtra +
            '</div>';

          if (daysRem !== null) {
            animateCounter(document.getElementById("home-days-counter"), daysRem);
          }
          animateCounter(document.getElementById("home-metric-total"), totalLic);
          animateCounter(document.getElementById("home-metric-rev"), revenueMonth, formatInr);
          return;
        }

        /* State B — Needs Attention: deliberately plain, flat, zero animation */
        if (pill) pill.textContent = String(issues.length || "!");
        const issueCountLabel = issues.length === 1 ? "1 item requires attention." : issues.length + " items require attention.";
        const issuesHtml = issues.map(function (iss) {
          const target = iss.target_tab === "payments" ? "pending" : (iss.target_tab || "licenses");
          const jumpKeyAttr = iss.license_key ? ' data-jump-key="' + escapeHtml(iss.license_key) + '"' : "";
          return (
            '<div class="plain-issue-row">' +
              '<div class="plain-issue-main">' +
                '<div class="plain-issue-title">' +
                  '<span class="plain-issue-tag">' + escapeHtml(issueTypeTag(iss.type)) + '</span>' +
                  '<span>' + escapeHtml(iss.title) + '</span>' +
                '</div>' +
                '<div class="plain-issue-detail">' + escapeHtml(iss.detail) + '</div>' +
              '</div>' +
              '<button type="button" class="plain-jump-btn" data-jump-tab="' + escapeHtml(target) + '"' + jumpKeyAttr + '>' +
                escapeHtml(iss.action_label || "Open") +
              '</button>' +
            '</div>'
          );
        }).join("");

        const secondaryActiveHtml = activeList.length > 0
          ? (
              '<div class="plain-section">' +
                '<div class="plain-section-head">Active Licenses (' + escapeHtml(activeList.length) + ')</div>' +
                activeList.map(function (lic) {
                  const daysStr = lic.days_remaining !== null && lic.days_remaining !== undefined
                    ? lic.days_remaining + "d left"
                    : "active";
                  return (
                    '<div class="plain-active-row">' +
                      '<span><strong class="mono">' + escapeHtml(lic.license_key) + '</strong> — ' + escapeHtml(lic.plan_label || lic.plan) + '</span>' +
                      '<span>' + escapeHtml(daysStr) + (lic.expires_date ? ' (expires ' + escapeHtml(lic.expires_date) + ')' : '') + '</span>' +
                    '</div>'
                  );
                }).join("") +
              '</div>'
            )
          : "";

        root.innerHTML =
          '<div class="home-plain-shell" data-home-state="needs_attention">' +
            '<div class="plain-banner">' +
              '<h2>Needs Attention</h2>' +
              '<p>' + escapeHtml(issueCountLabel) + '</p>' +
            '</div>' +
            '<div class="plain-metrics">' +
              '<div class="plain-metric">' +
                '<div class="plain-metric-k">Total Licenses</div>' +
                '<div class="plain-metric-v">' + escapeHtml(totalLic) + '</div>' +
                '<div class="plain-metric-sub">' + escapeHtml(activeLic) + ' active</div>' +
              '</div>' +
              '<div class="plain-metric">' +
                '<div class="plain-metric-k">Pending Payments</div>' +
                '<div class="plain-metric-v">' + escapeHtml(pendingPay) + '</div>' +
                '<div class="plain-metric-sub">' + (pendingPay === 1 ? "1 awaiting review" : pendingPay + " awaiting review") + '</div>' +
              '</div>' +
              '<div class="plain-metric">' +
                '<div class="plain-metric-k">Revenue This Month</div>' +
                '<div class="plain-metric-v">' + escapeHtml(formatInr(revenueMonth)) + '</div>' +
                '<div class="plain-metric-sub">' + escapeHtml(approvedMonth) + ' approved</div>' +
              '</div>' +
            '</div>' +
            '<div class="plain-section">' +
              '<div class="plain-section-head">Items Requiring Action (' + escapeHtml(issues.length) + ')</div>' +
              (issuesHtml || '<div class="plain-issue-row">No specific items listed.</div>') +
            '</div>' +
            secondaryActiveHtml +
          '</div>';
      }

      async function loadPending() {
        state.pending = await apiFetch("/api/v1/admin/payment-submissions?status=pending");
        renderPending();
      }

      async function loadLicenses() {
        state.licenses = await apiFetch("/api/v1/admin/list");
        renderLicenses();
      }

      async function loadHistory() {
        const all = await apiFetch("/api/v1/admin/payment-submissions?status=all");
        state.history = all.filter(function (s) {
          const st = (s.status || "").toLowerCase();
          return st === "approved" || st === "rejected";
        });
        renderHistory();
      }

      async function loadSummary() {
        state.summary = await apiFetch("/api/v1/admin/summary");
        renderSummary();
      }

      async function loadAllData() {
        const session = await apiFetch("/api/v1/admin/session");
        state.plans = session.plans || {};
        document.getElementById("session-meta").textContent =
          "Signed in as " + (session.username || "admin") +
          (session.expires_at ? " • Session expires " + formatDate(session.expires_at) : "");

        await Promise.all([loadPending(), loadLicenses(), loadHistory(), loadSummary()]);
      }

      document.querySelectorAll(".tab-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setActiveTab(btn.dataset.tab);
        });
      });

      document.querySelectorAll("[data-history-filter]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.historyFilter = btn.dataset.historyFilter;
          document.querySelectorAll("[data-history-filter]").forEach(function (b) {
            b.classList.toggle("active", b === btn);
          });
          renderHistory();
        });
      });

      document.getElementById("license-search").addEventListener("input", function (evt) {
        state.licenseSearch = evt.target.value || "";
        renderLicenses();
      });

      document.getElementById("refresh-btn").addEventListener("click", async function () {
        const btn = document.getElementById("refresh-btn");
        btn.disabled = true;
        try {
          await loadAllData();
          showToast("Refreshed.", "success");
        } catch (err) {
          if (err.message !== "Session expired") showToast(err.message, "error");
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById("logout-btn").addEventListener("click", async function () {
        const btn = document.getElementById("logout-btn");
        btn.disabled = true;
        try {
          await fetch("/api/v1/admin/logout", {
            method: "POST",
            credentials: "same-origin",
            headers: sessionStorage.getItem(TOKEN_KEY)
              ? { Authorization: "Bearer " + sessionStorage.getItem(TOKEN_KEY) }
              : {},
          });
        } catch (_e) {
          // Proceed with local cleanup and redirect
        }
        redirectToLogin(false);
      });

      document.getElementById("create-license-form").addEventListener("submit", async function (evt) {
        evt.preventDefault();
        const keyInput = document.getElementById("new-license-key");
        const noteInput = document.getElementById("new-license-note");
        const btn = document.getElementById("create-license-btn");
        const licenseKey = keyInput.value.trim();
        const note = noteInput.value.trim();
        if (!licenseKey) {
          showToast("License key is required.", "error");
          return;
        }

        btn.disabled = true;
        try {
          await apiFetch("/api/v1/admin/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ license_key: licenseKey, note: note || null }),
          });
          keyInput.value = "";
          noteInput.value = "";
          await loadLicenses();
          loadSummary().catch(function () {});
          showToast("Created license " + licenseKey, "success");
        } catch (err) {
          if (err.message !== "Session expired") showToast(err.message, "error");
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById("pending-list").addEventListener("click", async function (evt) {
        const zoomTarget = evt.target.closest("[data-action='zoom']");
        if (zoomTarget) {
          const card = zoomTarget.closest("[data-sub-id]");
          const id = Number(card && card.dataset.subId);
          const sub = state.pending.find(function (item) { return item.id === id; });
          if (sub) openLightbox(sub);
          return;
        }

        const actionBtn = evt.target.closest("button[data-action]");
        if (!actionBtn) return;
        const action = actionBtn.dataset.action;
        if (action !== "approve" && action !== "reject") return;

        const card = actionBtn.closest("[data-sub-id]");
        const id = Number(card && card.dataset.subId);
        const sub = state.pending.find(function (item) { return item.id === id; });
        if (!sub) return;

        const promptText = action === "approve"
          ? "Approve payment #" + id + " for " + sub.license_key + " (" + sub.claimed_plan + ")?"
          : "Reject payment #" + id + " for " + sub.license_key + "?";
        if (!window.confirm(promptText)) return;

        const buttons = card.querySelectorAll("button[data-action]");
        buttons.forEach(function (b) { b.disabled = true; });

        try {
          const res = await apiFetch(
            "/api/v1/admin/payment-submissions/" + encodeURIComponent(id) + "/" + action,
            { method: "POST" }
          );
          state.pending = state.pending.filter(function (item) { return item.id !== id; });
          renderPending();
          if (action === "approve") {
            const expTxt = res.renewal && res.renewal.expires_at
              ? " (expires " + formatDate(res.renewal.expires_at) + ")"
              : "";
            showToast("Approved #" + id + " for " + sub.license_key + expTxt, "success");
          } else {
            showToast("Rejected submission #" + id, "success");
          }
          Promise.all([loadLicenses(), loadHistory(), loadSummary()]).catch(function () {});
        } catch (err) {
          buttons.forEach(function (b) { b.disabled = false; });
          if (err.message !== "Session expired") showToast(err.message, "error");
        }
      });

      document.getElementById("licenses-container").addEventListener("click", async function (evt) {
        const btn = evt.target.closest("button[data-lic-action]");
        if (!btn) return;
        const row = btn.closest("[data-license-key]");
        const licenseKey = row && row.dataset.licenseKey;
        if (!licenseKey) return;
        const action = btn.dataset.licAction;

        if (action === "revoke" && !window.confirm("Revoke license " + licenseKey + "?")) {
          return;
        }

        let url = "";
        if (action === "revoke") {
          url = "/api/v1/admin/revoke?license_key=" + encodeURIComponent(licenseKey);
        } else if (action === "reactivate") {
          url = "/api/v1/admin/reactivate?license_key=" + encodeURIComponent(licenseKey);
        } else if (action === "renew") {
          const sel = row.querySelector(".plan-select");
          const plan = sel ? sel.value : "monthly";
          if (!window.confirm("Renew " + licenseKey + " with plan '" + plan + "'?")) {
            return;
          }
          url = "/api/v1/admin/renew?license_key=" + encodeURIComponent(licenseKey) +
                "&plan=" + encodeURIComponent(plan);
        } else {
          return;
        }

        btn.disabled = true;
        try {
          await apiFetch(url, { method: "POST" });
          await loadLicenses();
          loadSummary().catch(function () {});
          showToast("Updated " + licenseKey + " (" + action + ")", "success");
        } catch (err) {
          btn.disabled = false;
          if (err.message !== "Session expired") showToast(err.message, "error");
        }
      });

      document.getElementById("history-list").addEventListener("click", function (evt) {
        const img = evt.target.closest("[data-history-zoom]");
        if (!img) return;
        const card = img.closest("[data-history-id]");
        const id = Number(card && card.dataset.historyId);
        const sub = state.history.find(function (item) { return item.id === id; });
        if (sub) openLightbox(sub);
      });

      document.getElementById("home-summary").addEventListener("click", function (evt) {
        const btn = evt.target.closest("[data-jump-tab]");
        if (!btn) return;
        const tab = btn.dataset.jumpTab;
        const jumpKey = btn.dataset.jumpKey || "";
        if (tab === "licenses") {
          state.licenseSearch = jumpKey;
          const searchInput = document.getElementById("license-search");
          if (searchInput) searchInput.value = jumpKey;
          renderLicenses();
        }
        setActiveTab(tab);
      });

      document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
      document.getElementById("lightbox").addEventListener("click", function (evt) {
        if (evt.target.id === "lightbox") closeLightbox();
      });
      document.addEventListener("keydown", function (evt) {
        if (evt.key === "Escape") closeLightbox();
      });

      loadAllData().catch(function (err) {
        if (err.message !== "Session expired") {
          showToast(err.message || "Failed to load dashboard.", "error");
        }
      });
    })();
  </script>
</body>
</html>
