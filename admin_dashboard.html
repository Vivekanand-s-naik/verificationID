<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ANPR License Admin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: #f4f4f5;
    color: #18181b;
    min-height: 100vh;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  /* Mode transition ONLY when entering good-news state */
  body.mode-good {
    background: radial-gradient(circle at 18% 0%, #064e3b 0%, #071916 42%, #090d12 100%);
    color: #ecfdf5;
    transition: background 0.35s ease, color 0.25s ease;
  }
  body.mode-attention {
    background: #f4f4f5;
    color: #18181b;
  }

  /* ---------------- LOGIN VIEW ---------------- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #0f1318;
  }
  .login-card {
    width: 100%;
    max-width: 390px;
    background: #171c23;
    border: 1px solid #28303b;
    border-top: 3px solid #10b981;
    border-radius: 10px;
    padding: 28px 24px;
    color: #f4f4f5;
  }
  .login-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1px;
    color: #34d399;
    margin-bottom: 6px;
  }
  .login-card h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .login-card p { font-size: 13px; color: #9ca3af; margin-bottom: 18px; }
  .field-label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
  .input-dark {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #334155;
    background: #0d1117;
    color: #f8fafc;
    font-family: var(--font-mono);
    font-size: 13px;
    margin-bottom: 14px;
  }
  .input-dark:focus { outline: none; border-color: #10b981; }
  .btn-login {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: #10b981;
    color: #052e16;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-login:hover { background: #34d399; }
  .login-err {
    margin-top: 12px;
    padding: 9px 11px;
    border-radius: 6px;
    background: #3b1318;
    border: 1px solid #7f1d1d;
    color: #fecaca;
    font-size: 12px;
    display: none;
  }

  /* ---------------- SHELL & TOPBAR ---------------- */
  .app-shell { display: none; min-height: 100vh; flex-direction: column; }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid #d4d4d8;
    background: #ffffff;
  }
  body.mode-good .topbar {
    background: rgba(9, 16, 20, 0.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(52, 211, 153, 0.18);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  .brand-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: #e4e4e7;
    color: #3f3f46;
  }
  body.mode-good .brand-tag { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.35); }

  .nav-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav-tab {
    border: 1px solid #d4d4d8;
    background: transparent;
    color: #3f3f46;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .nav-tab.active { background: #18181b; color: #ffffff; border-color: #18181b; }
  body.mode-good .nav-tab {
    border-color: rgba(148, 163, 184, 0.22);
    color: #a7f3d0;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  body.mode-good .nav-tab:hover { background: rgba(16, 185, 129, 0.12); border-color: rgba(52, 211, 153, 0.45); }
  body.mode-good .nav-tab.active {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #022c22;
    border-color: transparent;
  }
  .tab-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    background: #27272a;
    color: #fafafa;
  }
  .nav-tab.active .tab-badge { background: #ffffff; color: #18181b; }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .btn-subtle {
    border: 1px solid #d4d4d8;
    background: #ffffff;
    color: #27272a;
    padding: 6px 11px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  body.mode-good .btn-subtle {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(148, 163, 184, 0.22);
    color: #d1fae5;
  }
  body.mode-good .btn-subtle:hover { background: rgba(255, 255, 255, 0.12); }

  .container { width: 100%; max-width: 1020px; margin: 0 auto; padding: 24px 18px 48px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* =====================================================================
     HOME STATE A: ALL SYSTEMS ACTIVE (VISUALLY RICH, ANIMATED SAAS HERO)
     ===================================================================== */
  @keyframes pulseRing {
    0% { transform: scale(1); opacity: 0.7; }
    70% { transform: scale(2.35); opacity: 0; }
    100% { transform: scale(2.35); opacity: 0; }
  }
  @keyframes softGlow {
    0%, 100% { box-shadow: 0 0 28px rgba(16, 185, 129, 0.22), inset 0 1px 0 rgba(167, 243, 208, 0.16); }
    50% { box-shadow: 0 0 44px rgba(16, 185, 129, 0.36), inset 0 1px 0 rgba(167, 243, 208, 0.28); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .good-hero {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    padding: 32px 28px;
    background: linear-gradient(135deg, rgba(6, 78, 59, 0.72) 0%, rgba(13, 33, 36, 0.92) 55%, rgba(15, 23, 42, 0.95) 100%);
    border: 1px solid rgba(52, 211, 153, 0.38);
    animation: softGlow 4s ease-in-out infinite, fadeUp 0.35s ease-out;
    margin-bottom: 20px;
  }
  .good-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.16);
    border: 1px solid rgba(52, 211, 153, 0.48);
    color: #6ee7b7;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.9px;
    margin-bottom: 18px;
  }
  .beacon {
    position: relative;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 12px #34d399;
    display: inline-block;
  }
  .beacon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #34d399;
    animation: pulseRing 2.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }
  .good-hero-grid {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
  }
  .good-plan-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #a7f3d0;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .good-title {
    font-size: clamp(26px, 4.5vw, 36px);
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #ffffff;
    margin-bottom: 8px;
  }
  .good-meta {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: #99f6e4;
    opacity: 0.9;
  }
  .good-days-box {
    background: rgba(2, 44, 34, 0.65);
    border: 1px solid rgba(52, 211, 153, 0.36);
    border-radius: 12px;
    padding: 16px 22px;
    text-align: right;
    min-width: 185px;
  }
  .good-days-num {
    font-family: var(--font-mono);
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
    color: #34d399;
  }
  .good-days-sub {
    font-size: 12px;
    color: #a7f3d0;
    margin-top: 6px;
    letter-spacing: 0.4px;
  }

  .good-metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 20px;
    animation: fadeUp 0.45s ease-out;
  }
  .good-metric-card {
    background: rgba(15, 25, 30, 0.78);
    border: 1px solid rgba(52, 211, 153, 0.22);
    border-radius: 12px;
    padding: 18px 20px;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .good-metric-card:hover {
    transform: translateY(-2px);
    border-color: rgba(52, 211, 153, 0.5);
  }
  .good-metric-k {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.8px;
    color: #94a3b8;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .good-metric-v {
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 800;
    color: #ecfdf5;
  }
  .good-metric-sub { font-size: 12px; color: #6ee7b7; margin-top: 4px; }

  .good-fleet {
    background: rgba(15, 25, 30, 0.65);
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .good-fleet h3 { font-size: 12px; font-family: var(--font-mono); letter-spacing: 0.8px; color: #94a3b8; margin-bottom: 10px; }
  .good-fleet-row {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;
    padding: 8px 0; border-top: 1px solid rgba(148, 163, 184, 0.12); font-size: 13px;
  }
  .good-fleet-row:first-of-type { border-top: none; }

  /* =====================================================================
     HOME STATE B: NEEDS ATTENTION (DELIBERATELY PLAIN, FLAT, ZERO ANIMATION)
     ===================================================================== */
  .plain-header {
    background: #ffffff;
    border: 1px solid #d4d4d8;
    border-radius: 4px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .plain-header h2 { font-size: 17px; font-weight: 700; color: #18181b; margin-bottom: 4px; }
  .plain-header p { font-size: 13px; color: #52525b; }

  .plain-metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .plain-metric {
    background: #ffffff;
    border: 1px solid #d4d4d8;
    border-radius: 4px;
    padding: 12px 14px;
  }
  .plain-metric-k { font-size: 11px; color: #71717a; text-transform: uppercase; letter-spacing: 0.4px; }
  .plain-metric-v { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: #18181b; margin-top: 2px; }

  .plain-card {
    background: #ffffff;
    border: 1px solid #d4d4d8;
    border-radius: 4px;
    margin-bottom: 14px;
  }
  .plain-card-hdr {
    padding: 10px 14px;
    border-bottom: 1px solid #e4e4e7;
    font-size: 12px;
    font-weight: 700;
    color: #3f3f46;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    background: #fafafa;
  }
  .issue-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #e4e4e7;
  }
  .issue-row:last-child { border-bottom: none; }
  .issue-title { font-size: 14px; font-weight: 600; color: #18181b; }
  .issue-detail { font-size: 12.5px; color: #52525b; margin-top: 2px; }
  .issue-tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid #a1a1aa;
    background: #f4f4f5;
    color: #27272a;
    margin-right: 8px;
  }
  .plain-action-btn {
    padding: 7px 12px;
    border: 1px solid #52525b;
    border-radius: 4px;
    background: #ffffff;
    color: #18181b;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .plain-action-btn:hover { background: #e4e4e7; }

  .secondary-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 14px;
    border-bottom: 1px solid #f4f4f5;
    font-size: 13px;
    color: #3f3f46;
  }
  .secondary-row:last-child { border-bottom: none; }

  /* ---------------- LICENSES & PAYMENTS TABS ---------------- */
  .panel-card {
    background: #ffffff;
    color: #18181b;
    border: 1px solid #d4d4d8;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 16px;
  }
  body.mode-good .panel-card {
    background: rgba(15, 23, 30, 0.88);
    color: #f1f5f9;
    border-color: rgba(148, 163, 184, 0.22);
  }
  .panel-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .panel-head h2 { font-size: 16px; font-weight: 700; }
  .inline-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .field-in {
    padding: 7px 10px;
    border-radius: 5px;
    border: 1px solid #cbd5e1;
    font-size: 13px;
    background: #ffffff;
    color: #18181b;
  }
  .btn-primary {
    padding: 7px 13px;
    border: none;
    border-radius: 5px;
    background: #18181b;
    color: #ffffff;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  body.mode-good .btn-primary { background: #10b981; color: #052e16; }
  .btn-sm {
    padding: 5px 9px;
    border-radius: 4px;
    border: 1px solid #a1a1aa;
    background: #ffffff;
    color: #18181b;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-sm:hover { background: #e4e4e7; }
  .btn-sm-danger { border-color: #b91c1c; color: #991b1b; }
  .btn-sm-ok { border-color: #047857; color: #065f46; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e4e4e7; vertical-align: middle; }
  body.mode-good th, body.mode-good td { border-bottom-color: rgba(148, 163, 184, 0.15); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #71717a; }
  .mono { font-family: var(--font-mono); }

  .sub-card {
    border: 1px solid #e4e4e7;
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-start;
    justify-content: space-between;
  }
  body.mode-good .sub-card { border-color: rgba(148, 163, 184, 0.2); }
  .sub-thumb {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid #cbd5e1;
    cursor: pointer;
    background: #f4f4f5;
  }
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .lightbox img { max-width: 94vw; max-height: 88vh; border-radius: 6px; }
  .toast {
    position: fixed; bottom: 18px; right: 18px; z-index: 40;
    padding: 10px 14px; border-radius: 6px; background: #18181b; color: #ffffff;
    font-size: 13px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.22);
  }

  @media (max-width: 680px) {
    .good-metrics, .plain-metrics { grid-template-columns: 1fr; }
    .good-hero { padding: 22px 18px; }
    .good-days-box { width: 100%; text-align: left; }
    .topbar { padding: 10px 12px; }
  }
</style>
</head>
<body class="mode-attention">

<!-- LOGIN GATE -->
<div id="login-view" class="login-wrap">
  <form id="login-form" class="login-card">
    <div class="login-eyebrow">VERIFICATIONID // ADMIN</div>
    <h1>License Console</h1>
    <p>Enter your admin token to view subscription health, licenses, and UPI payment proofs.</p>
    <label class="field-label" for="token-input">Admin Token</label>
    <input id="token-input" class="input-dark" type="password" autocomplete="current-password" placeholder="X-Admin-Token" required />
    <button type="submit" class="btn-login">Sign In</button>
    <div id="login-error" class="login-err"></div>
  </form>
</div>

<!-- MAIN ADMIN SHELL -->
<div id="app-shell" class="app-shell">
  <header class="topbar">
    <div class="brand">
      <span>ANPR License Admin</span>
      <span class="brand-tag" id="top-state-tag">CHECKING</span>
    </div>
    <nav class="nav-tabs" aria-label="Admin sections">
      <button class="nav-tab active" data-tab="home">Home</button>
      <button class="nav-tab" data-tab="licenses">Licenses</button>
      <button class="nav-tab" data-tab="payments">Pending Payments <span class="tab-badge" id="nav-pending-badge" style="display:none">0</span></button>
    </nav>
    <div class="topbar-actions">
      <button class="btn-subtle" id="btn-refresh">Refresh</button>
      <button class="btn-subtle" id="btn-logout">Sign Out</button>
    </div>
  </header>

  <main class="container">
    <!-- TAB 1: HOME (DEFAULT FIRST VIEW AFTER LOGIN) -->
    <section id="tab-home" class="tab-panel active">
      <div id="home-root">Loading license summary...</div>
    </section>

    <!-- TAB 2: LICENSES -->
    <section id="tab-licenses" class="tab-panel">
      <div class="panel-card">
        <div class="panel-head">
          <h2>Provision New License</h2>
        </div>
        <form id="create-lic-form" class="inline-form">
          <input id="new-lic-key" class="field-in mono" placeholder="CUST-ANPR-0002" required />
          <input id="new-lic-note" class="field-in" placeholder="Site / customer note" />
          <select id="new-lic-plan" class="field-in">
            <option value="trial">Free Trial (180d)</option>
            <option value="launch90">Launch Offer (90d)</option>
            <option value="monthly">Monthly (30d)</option>
            <option value="quarterly">Quarterly (90d)</option>
            <option value="annual">Annual (365d)</option>
          </select>
          <button type="submit" class="btn-primary">Create License</button>
        </form>
      </div>

      <div class="panel-card">
        <div class="panel-head">
          <h2>All Licenses</h2>
          <span class="mono" id="lic-count-label" style="font-size:12px;color:#71717a;"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>License Key</th>
                <th>Status</th>
                <th>Plan</th>
                <th>Expires</th>
                <th>Last Seen</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="licenses-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- TAB 3: PENDING PAYMENTS -->
    <section id="tab-payments" class="tab-panel">
      <div class="panel-card">
        <div class="panel-head">
          <h2>UPI Payment Submissions</h2>
          <select id="pay-status-filter" class="field-in">
            <option value="pending" selected>Pending Only</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="all">All Submissions</option>
          </select>
        </div>
        <div id="payments-list"></div>
      </div>
    </section>
  </main>
</div>

<div id="lightbox" class="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img" alt="Payment screenshot preview" />
</div>
<div id="toast" class="toast"></div>

<script>
(() => {
  const TOKEN_KEY = "anpr_admin_token";
  let adminToken = sessionStorage.getItem(TOKEN_KEY) || "";
  let activeTab = "home";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.style.display = "none"; }, 3000);
  }

  async function api(path, opts = {}) {
    const headers = Object.assign({ "X-Admin-Token": adminToken }, opts.headers || {});
    const res = await fetch(path, Object.assign({}, opts, { headers }));
    if (res.status === 403 || res.status === 401) {
      throw new Error("AUTH_DENIED");
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : {}; } catch { data = { detail: text }; }
    if (!res.ok) throw new Error((data && data.detail) || `HTTP ${res.status}`);
    return data;
  }

  function animateNumber(el, target, prefix = "") {
    if (!el || typeof target !== "number" || !Number.isFinite(target)) return;
    const duration = 520;
    const start = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = prefix + Math.round(target * eased).toLocaleString("en-IN");
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function formatDateShort(iso) {
    if (!iso) return "—";
    return String(iso).slice(0, 10);
  }

  function formatDateTime(iso) {
    if (!iso) return "Never";
    return String(iso).replace("T", " ").slice(0, 16) + " UTC";
  }

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll(".nav-tab").forEach((b) => {
      b.classList.toggle("active", b.dataset.tab === tab);
    });
    document.querySelectorAll(".tab-panel").forEach((p) => {
      p.classList.toggle("active", p.id === `tab-${tab}`);
    });
    if (tab === "home") loadHome();
    if (tab === "licenses") loadLicenses();
    if (tab === "payments") loadPayments();
  }

  function renderHome(summary) {
    const root = $("home-root");
    const c = summary.counts || {};
    const isGood = summary.overall_state === "all_good";

    document.body.classList.toggle("mode-good", isGood);
    document.body.classList.toggle("mode-attention", !isGood);

    const stateTag = $("top-state-tag");
    stateTag.textContent = isGood ? "ALL SYSTEMS ACTIVE" : "NEEDS ATTENTION";

    const pendBadge = $("nav-pending-badge");
    if ((c.pending_payments || 0) > 0) {
      pendBadge.textContent = String(c.pending_payments);
      pendBadge.style.display = "inline-block";
    } else {
      pendBadge.style.display = "none";
    }

    if (isGood) {
      const p = summary.primary_license || {};
      const days = typeof p.days_remaining === "number" ? p.days_remaining : null;
      const fleetHtml = (summary.active_licenses || []).length > 1
        ? `<div class="good-fleet">
             <h3>ACTIVE LICENSES (${summary.active_licenses.length})</h3>
             ${summary.active_licenses.map((lic) => `
               <div class="good-fleet-row">
                 <span class="mono"><strong>${esc(lic.license_key)}</strong> &middot; ${esc(lic.plan_label)}</span>
                 <span class="mono" style="color:#6ee7b7">${lic.days_remaining != null ? lic.days_remaining + "d left" : "Active"} (${esc(lic.expires_date || "—")})</span>
               </div>`).join("")}
           </div>`
        : "";

      root.innerHTML = `
        <div class="good-hero">
          <div class="good-status-pill">
            <span class="beacon" aria-hidden="true"></span>
            ALL SYSTEMS ACTIVE
          </div>
          <div class="good-hero-grid">
            <div>
              <div class="good-plan-label">${esc(p.plan_label || "Active Plan")}</div>
              <div class="good-title">${esc(p.license_key || "Primary License")}</div>
              <div class="good-meta">
                Expires ${esc(p.expires_date || "—")} &nbsp;&bull;&nbsp; Last check: ${esc(formatDateTime(p.last_seen))}
              </div>
            </div>
            <div class="good-days-box">
              <div class="good-days-num" id="anim-days">${days != null ? days : "—"}</div>
              <div class="good-days-sub">${days === 1 ? "DAY REMAINING" : "DAYS REMAINING"}</div>
            </div>
          </div>
        </div>

        <div class="good-metrics">
          <div class="good-metric-card">
            <div class="good-metric-k">Total Licenses</div>
            <div class="good-metric-v" id="anim-total">${c.total_licenses || 0}</div>
            <div class="good-metric-sub">${c.active_licenses || 0} active &amp; healthy</div>
          </div>
          <div class="good-metric-card">
            <div class="good-metric-k">Pending Payments</div>
            <div class="good-metric-v" id="anim-pending">${c.pending_payments || 0}</div>
            <div class="good-metric-sub">Queue clear</div>
          </div>
          <div class="good-metric-card">
            <div class="good-metric-k">Revenue This Month</div>
            <div class="good-metric-v" id="anim-rev">&#8377;${Number(c.revenue_this_month_inr || 0).toLocaleString("en-IN")}</div>
            <div class="good-metric-sub">${c.approved_payments_this_month || 0} approved this month</div>
          </div>
        </div>
        ${fleetHtml}
      `;

      if (days != null) animateNumber($("anim-days"), days);
      animateNumber($("anim-total"), Number(c.total_licenses || 0));
      animateNumber($("anim-rev"), Number(c.revenue_this_month_inr || 0), "₹");
      return;
    }

    // DELIBERATELY PLAIN, FLAT, NO-ANIMATION ATTENTION-NEEDED STATE
    const issues = summary.issues || [];
    const activeList = summary.active_licenses || [];

    const issuesHtml = issues.map((iss) => `
      <div class="issue-row">
        <div>
          <div class="issue-title">
            <span class="issue-tag">${esc((iss.type || "issue").toUpperCase().replace("_", " "))}</span>
            ${esc(iss.title)}
          </div>
          <div class="issue-detail">${esc(iss.detail)}</div>
        </div>
        <button class="plain-action-btn" data-jump="${esc(iss.target_tab || "licenses")}">${esc(iss.action_label || "Open")} &rarr;</button>
      </div>
    `).join("");

    const activeSecondaryHtml = activeList.length > 0
      ? `<div class="plain-card">
           <div class="plain-card-hdr">Active Licenses (${activeList.length})</div>
           ${activeList.map((lic) => `
             <div class="secondary-row">
               <span class="mono">${esc(lic.license_key)} &mdash; ${esc(lic.plan_label)}</span>
               <span class="mono">${lic.days_remaining != null ? lic.days_remaining + " days left" : "Active"} (expires ${esc(lic.expires_date || "—")})</span>
             </div>`).join("")}
         </div>`
      : "";

    root.innerHTML = `
      <div class="plain-header">
        <h2>Attention Needed (${issues.length} ${issues.length === 1 ? "item" : "items"})</h2>
        <p>One or more licenses or payment submissions require review.</p>
      </div>

      <div class="plain-metrics">
        <div class="plain-metric">
          <div class="plain-metric-k">Total Licenses</div>
          <div class="plain-metric-v">${c.total_licenses || 0}</div>
        </div>
        <div class="plain-metric">
          <div class="plain-metric-k">Pending Payments</div>
          <div class="plain-metric-v">${c.pending_payments || 0}</div>
        </div>
        <div class="plain-metric">
          <div class="plain-metric-k">Revenue This Month</div>
          <div class="plain-metric-v">&#8377;${Number(c.revenue_this_month_inr || 0).toLocaleString("en-IN")}</div>
        </div>
      </div>

      <div class="plain-card">
        <div class="plain-card-hdr">Action Required</div>
        ${issuesHtml}
      </div>

      ${activeSecondaryHtml}
    `;

    root.querySelectorAll("[data-jump]").forEach((btn) => {
      btn.addEventListener("click", () => switchTab(btn.dataset.jump));
    });
  }

  async function loadHome() {
    try {
      const summary = await api("/api/v1/admin/summary");
      renderHome(summary);
    } catch (err) {
      if (err.message === "AUTH_DENIED") return logout("Session token rejected.");
      $("home-root").textContent = "Error loading summary: " + err.message;
    }
  }

  async function loadLicenses() {
    try {
      const rows = await api("/api/v1/admin/list");
      $("lic-count-label").textContent = `${rows.length} total`;
      const tbody = $("licenses-tbody");
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:#71717a">No licenses found.</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map((r) => {
        const key = esc(r.license_key);
        const st = (r.status || "active").toLowerCase();
        const isRevoked = st === "revoked";
        return `
          <tr>
            <td class="mono"><strong>${key}</strong>${r.note ? `<div style="font-size:11px;color:#71717a">${esc(r.note)}</div>` : ""}</td>
            <td class="mono">${esc(st.toUpperCase())}</td>
            <td>${esc(r.plan || "trial")}</td>
            <td class="mono">${esc(formatDateShort(r.expires_at))}</td>
            <td class="mono" style="font-size:11.5px">${esc(formatDateTime(r.last_seen))}</td>
            <td>
              <div style="display:flex;flex-wrap:wrap;gap:5px">
                ${isRevoked
                  ? `<button class="btn-sm btn-sm-ok" data-act="reactivate" data-key="${key}">Reactivate</button>`
                  : `<button class="btn-sm btn-sm-danger" data-act="revoke" data-key="${key}">Revoke</button>`}
                <button class="btn-sm" data-act="renew" data-key="${key}" data-plan="monthly">+30d</button>
                <button class="btn-sm" data-act="renew" data-key="${key}" data-plan="quarterly">+90d</button>
                <button class="btn-sm" data-act="renew" data-key="${key}" data-plan="annual">+365d</button>
              </div>
            </td>
          </tr>`;
      }).join("");

      tbody.querySelectorAll("[data-act]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const act = btn.dataset.act;
          const k = btn.dataset.key;
          try {
            if (act === "revoke") {
              await api(`/api/v1/admin/revoke?license_key=${encodeURIComponent(k)}`, { method: "POST" });
              toast(`Revoked ${k}`);
            } else if (act === "reactivate") {
              await api(`/api/v1/admin/reactivate?license_key=${encodeURIComponent(k)}`, { method: "POST" });
              toast(`Reactivated ${k}`);
            } else if (act === "renew") {
              const plan = btn.dataset.plan;
              await api(`/api/v1/admin/renew?license_key=${encodeURIComponent(k)}&plan=${encodeURIComponent(plan)}`, { method: "POST" });
              toast(`Renewed ${k} (${plan})`);
            }
            await Promise.all([loadLicenses(), loadHome()]);
          } catch (e) {
            toast("Error: " + e.message);
          }
        });
      });
    } catch (err) {
      if (err.message === "AUTH_DENIED") return logout("Session token rejected.");
      toast("Error loading licenses: " + err.message);
    }
  }

  async function loadPayments() {
    const status = $("pay-status-filter").value;
    try {
      const items = await api(`/api/v1/admin/payment-submissions?status=${encodeURIComponent(status)}`);
      const wrap = $("payments-list");
      if (!items.length) {
        wrap.innerHTML = `<p style="font-size:13px;color:#71717a;">No ${esc(status)} payment submissions.</p>`;
        return;
      }
      wrap.innerHTML = items.map((s) => `
        <div class="sub-card">
          <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;">
            <img class="sub-thumb" src="${esc(s.image_data_uri)}" alt="Proof #${s.id}" data-zoom="${esc(s.image_data_uri)}" />
            <div>
              <div class="mono" style="font-weight:700;font-size:14px;">#${s.id} &middot; ${esc(s.license_key)}</div>
              <div style="font-size:13px;margin-top:3px;">${esc(s.plan_label || s.claimed_plan)} &mdash; &#8377;${esc(s.price_inr ?? "?")} (${esc(s.days ?? "?")}d)</div>
              <div class="mono" style="font-size:11.5px;color:#71717a;margin-top:3px;">Status: ${esc(s.status.toUpperCase())} &middot; ${esc(formatDateTime(s.submitted_at))}</div>
              <div class="mono" style="font-size:11px;color:#71717a;">Device: ${esc((s.device_id || "").slice(0, 16))}</div>
            </div>
          </div>
          ${s.status === "pending" ? `
            <div style="display:flex;gap:6px;">
              <button class="btn-sm btn-sm-ok" data-pay-act="approve" data-id="${s.id}">Approve &amp; Renew</button>
              <button class="btn-sm btn-sm-danger" data-pay-act="reject" data-id="${s.id}">Reject</button>
            </div>` : ""}
        </div>
      `).join("");

      wrap.querySelectorAll("[data-zoom]").forEach((img) => {
        img.addEventListener("click", () => {
          $("lightbox-img").src = img.dataset.zoom;
          $("lightbox").style.display = "flex";
        });
      });
      wrap.querySelectorAll("[data-pay-act]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const act = btn.dataset.payAct;
          const id = btn.dataset.id;
          try {
            await api(`/api/v1/admin/payment-submissions/${id}/${act}`, { method: "POST" });
            toast(`Submission #${id} ${act}d.`);
            await Promise.all([loadPayments(), loadHome()]);
          } catch (e) {
            toast("Error: " + e.message);
          }
        });
      });
    } catch (err) {
      if (err.message === "AUTH_DENIED") return logout("Session token rejected.");
      toast("Error loading payments: " + err.message);
    }
  }

  function showApp() {
    $("login-view").style.display = "none";
    $("app-shell").style.display = "flex";
    switchTab("home");
  }

  function logout(errMsg = "") {
    adminToken = "";
    sessionStorage.removeItem(TOKEN_KEY);
    document.body.className = "mode-attention";
    $("app-shell").style.display = "none";
    $("login-view").style.display = "flex";
    $("token-input").value = "";
    const err = $("login-error");
    if (errMsg) {
      err.textContent = errMsg;
      err.style.display = "block";
    } else {
      err.style.display = "none";
    }
  }

  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("login-error");
    err.style.display = "none";
    adminToken = $("token-input").value.trim();
    try {
      const summary = await api("/api/v1/admin/summary");
      sessionStorage.setItem(TOKEN_KEY, adminToken);
      showApp();
      renderHome(summary);
    } catch (ex) {
      adminToken = "";
      err.textContent = ex.message === "AUTH_DENIED" ? "Invalid admin token." : ex.message;
      err.style.display = "block";
    }
  });

  $("create-lic-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const key = $("new-lic-key").value.trim();
    const note = $("new-lic-note").value.trim() || null;
    const plan = $("new-lic-plan").value;
    try {
      await api("/api/v1/admin/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ license_key: key, note, plan }),
      });
      $("new-lic-key").value = "";
      $("new-lic-note").value = "";
      toast(`Created ${key}`);
      await Promise.all([loadLicenses(), loadHome()]);
    } catch (ex) {
      toast("Create failed: " + ex.message);
    }
  });

  document.querySelectorAll(".nav-tab").forEach((b) => {
    b.addEventListener("click", () => switchTab(b.dataset.tab));
  });
  $("pay-status-filter").addEventListener("change", loadPayments);
  $("btn-refresh").addEventListener("click", () => {
    loadHome();
    if (activeTab === "licenses") loadLicenses();
    if (activeTab === "payments") loadPayments();
    toast("Refreshed.");
  });
  $("btn-logout").addEventListener("click", () => logout());

  if (adminToken) {
    showApp();
  }
})();
</script>
</body>
</html>
